media:
  input: public/uploads
  output: /uploads
  rename: safe
  categories: [image]


content:

  # ==============================
  # EVENTS
  # ==============================
  - name: events
    label: Events
    type: collection
    path: src/content/events
    format: yaml-frontmatter

    filename:
      template: "{title}.md"
      field: create

    view:
      primary: title
      fields:
        - title
        - date
        - location
        - time
      sort:
        - date
        - title
      search:
        - title
        - location
      default:
        sort: date
        order: desc

    operations:
      create: true
      rename: true
      delete: true

    fields:
      - name: title
        label: Event Title
        type: string
        required: true

      - name: date
        label: Event Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: time
        label: Time
        type: string
        required: true
        description: "Example: 12:00–1:30 PM"

      - name: location
        label: Location
        type: select
        required: true
        options:
          values:
            - Melville
            - Commack

      - name: ages
        label: Ages
        type: string
        description: "Optional. Example: 12+"

      - name: price
        label: Price
        type: string
        description: "Optional. Example: $35"

      - name: link
        label: Event / Registration Link
        type: string
        description: "Optional Eventbrite or registration URL"

      - name: image
        label: Event Image
        type: image

      - name: body
        label: Event Description
        type: rich-text
        options:
          format: markdown
          media: false


  # ==============================
  # STAFF / FACULTY
  # ==============================
  - name: staff
    label: Faculty & Staff
    type: collection
    path: src/content/staff
    format: yaml-frontmatter

    filename:
      template: "{name}.md"
      field: create

    view:
      primary: name
      fields:
        - name
        - role
        - order
      sort:
        - order
        - name
      search:
        - name
        - role
      default:
        sort: order
        order: asc

    operations:
      create: true
      rename: false
      delete: false

    fields:
      - name: name
        label: Name
        type: string
        required: true

      - name: role
        label: Position / Title
        type: string
        required: true

      - name: photo
        label: Headshot
        type: image
        description: "Use a consistent portrait-style staff image."

      - name: order
        label: Display Order
        type: number
        required: true
        description: "Lower numbers appear first."

      - name: body
        label: Biography
        type: rich-text
        options:
          format: markdown
          media: false


  # ==============================
  # SCHEDULES
  # ==============================
  - name: schedules
    label: Schedules
    type: file
    path: src/content/pages/schedules.md
    format: yaml-frontmatter

    operations:
      delete: false
      rename: false

    fields:
      - name: title
        label: Page Title
        type: string
        required: true
        description: "Main heading shown on the Schedules page."

      - name: description
        label: Page Description
        type: text
        required: true
        description: "Introductory text shown underneath the Schedules heading."

      - name: section
        label: Page Section
        type: string
        readonly: true
        description: "System value. Please do not change."

      - name: schedules
        label: Schedule Cards
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: false
            summary: "{title}"

        fields:
          - name: title
            label: Schedule Title
            type: string
            required: true
            description: "Example: Melville Recreational Schedule 2026–2027"

          - name: image
            label: Schedule Image
            type: image
            required: true
            description: "Upload or select the current schedule image."

          - name: location
            label: Studio Location
            type: select
            required: true
            options:
              values:
                - Melville
                - Commack


  # ==============================
  # CALENDAR
  # ==============================
  - name: calendar
    label: Calendar
    type: file
    path: src/data/calendar.json
    format: json

    operations:
      delete: false
      rename: false

    fields:
      - name: season
        label: Season
        type: string
        required: true
        description: "Example: 2026–2027"

      - name: eyebrow
        label: Small Heading
        type: string
        required: true

      - name: title
        label: Page Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: image
        label: Calendar Image
        type: image
        required: true
        description: "Upload the current studio-year calendar image."

      - name: image_alt
        label: Calendar Image Alt Text
        type: string
        required: true
        description: "Describe the calendar image for accessibility."


  # ==============================
  # SITE ALERT BANNER
  # ==============================
  - name: banner
    label: Site Alert Banner
    type: file
    path: src/data/banner.json
    format: json

    operations:
      delete: false
      rename: false

    fields:
      - name: show
        label: Show Banner on Site
        type: boolean
        description: "Turn on to show the message across the top of every page (for example, weather closings). Turn off to hide it."

      - name: message
        label: Banner Message
        type: string
        description: "Example: We are closed today due to weather. Please stay safe."


  # ==============================
  # ABOUT & PROGRAM PAGES
  # ==============================
  - name: pages
    label: About & Program Pages
    type: collection
    path: src/content/pages
    format: yaml-frontmatter
    exclude:
      - schedules.md

    filename:
      template: "{primary}.md"

    view:
      primary: title
      fields:
        - title
        - description
      sort:
        - order
        - title
      default:
        sort: order
        order: asc

    operations:
      create: false
      rename: false
      delete: false

    fields:
      - name: title
        label: Page Title
        type: string
        required: true

      - name: description
        label: Short Description
        type: text
        description: "One or two sentences shown under the title and in search results."

      - name: image
        label: Main Image
        type: image
        description: "Optional picture for this page."

      - name: section
        label: Page Group
        type: select
        readonly: true
        description: "System value. Please do not change."
        options:
          values:
            - none
            - programs
            - schedules

      - name: order
        label: Display Order
        type: number
        readonly: true
        description: "System value. Please do not change."

      - name: body
        label: Page Content
        type: rich-text
        options:
          format: markdown
          media: false


  # ==============================
  # STUDIO CONTACT INFO & SOCIAL
  # ==============================
  - name: contact
    label: Contact Info & Social Links
    type: file
    path: src/data/locations.json
    format: json

    operations:
      delete: false
      rename: false

    fields:
      - name: locations
        label: Studio Locations
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Studio Name
            type: string
            required: true
            readonly: true
            description: "System value. Please do not change."

          - name: address
            label: Address
            type: string
            required: true

          - name: phone
            label: Phone Number
            type: string
            required: true
            description: "Example: (631) 424-2243"

          - name: email
            label: Studio Email
            type: string
            required: true

          - name: portal
            label: Parent Portal Link
            type: string
            required: true
            description: "Full web address (starts with https://)"

      - name: email
        label: Main Contact Email
        type: string
        required: true

      - name: facebook
        label: Facebook Page Link
        type: string
        description: "Full web address (starts with https://)"

      - name: instagram
        label: Instagram Page Link
        type: string
        description: "Full web address (starts with https://)"


  # ==============================
  # HOME PAGE
  # ==============================
  - name: home
    label: Home Page
    type: file
    path: src/data/home.json
    format: json

    operations:
      delete: false
      rename: false

    fields:
      - name: hero
        label: Top Banner (Hero)
        type: object
        fields:
          - name: eyebrow
            label: Small Line Above Headline
            type: string
          - name: headline_line1
            label: Headline - First Line
            type: string
          - name: headline_line2
            label: Headline - Second Line (shown in accent color)
            type: string
          - name: text
            label: Intro Text
            type: text
          - name: button1_label
            label: First Button - Text
            type: string
          - name: button1_link
            label: First Button - Page Link
            type: string
            description: "Example: /programs"
          - name: button2_label
            label: Second Button - Text
            type: string
          - name: button2_link
            label: Second Button - Page Link
            type: string
            description: "Example: /schedules"
          - name: stat_title
            label: Badge - Large Text
            type: string
            description: "Example: Since 2010"
          - name: stat_text
            label: Badge - Small Text
            type: string

      - name: intro
        label: Welcome Section
        type: object
        fields:
          - name: eyebrow
            label: Small Line Above Headline
            type: string
          - name: headline_line1
            label: Headline - First Line
            type: string
          - name: headline_line2
            label: Headline - Second Line
            type: string
          - name: paragraph1
            label: First Paragraph
            type: text
          - name: paragraph2
            label: Second Paragraph
            type: text
          - name: link_label
            label: Link - Text
            type: string
          - name: link_url
            label: Link - Page Address
            type: string
            description: "Example: /about-us"
