media:
  - name: images
    input: public/uploads
    output: /uploads
    rename: safe
    categories: [image]
  - name: videos
    input: public/uploads
    output: /uploads
    rename: safe
    categories: [video]


content:

  # ==============================
  # EVENTS
  # ==============================
  - name: events
    label: Events
    type: collection
    path: src/content/events
    format: yaml-frontmatter

    filename:
      template: "{title}.md"
      field: create

    view:
      primary: title
      fields:
        - title
        - date
        - location
        - time
      sort:
        - date
        - title
      search:
        - title
        - location
      default:
        sort: date
        order: desc

    operations:
      create: true
      rename: true
      delete: true

    fields:
      - name: title
        label: Event Title
        type: string
        required: true

      - name: date
        label: Event Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: time
        label: Time
        type: string
        required: true
        description: "Example: 12:00–1:30 PM"

      - name: location
        label: Location
        type: select
        required: true
        options:
          values:
            - Melville
            - Commack

      - name: ages
        label: Ages
        type: string
        description: "Optional. Example: 12+"

      - name: price
        label: Price
        type: string
        description: "Optional. Example: $35"

      - name: link
        label: Event / Registration Link
        type: string
        description: "Optional Eventbrite or registration URL"

      - name: image
        label: Event Image
        type: image
        description: "Max file size: 5 MB."

      - name: body
        label: Event Description
        type: rich-text
        options:
          format: markdown
          media: false


  # ==============================
  # STAFF / FACULTY
  # ==============================
  - name: staff
    label: Faculty & Staff
    type: collection
    path: src/content/staff
    format: yaml-frontmatter

    filename:
      template: "{name}.md"
      field: create

    view:
      primary: name
      fields:
        - name
        - role
        - order
      sort:
        - order
        - name
      search:
        - name
        - role
      default:
        sort: order
        order: asc

    operations:
      create: true
      rename: false
      delete: false

    fields:
      - name: name
        label: Name
        type: string
        required: true

      - name: role
        label: Position / Title
        type: string
        required: true

      - name: photo
        label: Headshot
        type: image
        description: "Use a consistent portrait-style staff image. Max file size: 5 MB."

      - name: order
        label: Display Order
        type: number
        required: true
        description: "Lower numbers appear first."

      - name: body
        label: Biography
        type: rich-text
        options:
          format: markdown
          media: false


  # ==============================
  # SCHEDULES
  # ==============================
  - name: schedules
    label: Schedules
    type: file
    path: src/content/pages/schedules.md
    format: yaml-frontmatter

    operations:
      delete: false
      rename: false

    fields:
      - name: title
        label: Page Title
        type: string
        required: true
        description: "Main heading shown on the Schedules page."

      - name: description
        label: Page Description
        type: text
        required: true
        description: "Introductory text shown underneath the Schedules heading."

      - name: section
        label: Page Section
        type: string
        readonly: true
        description: "System value. Please do not change."

      - name: schedules
        label: Schedule Cards
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: false
            summary: "{title}"

        fields:
          - name: title
            label: Schedule Title
            type: string
            required: true
            description: "Example: Melville Recreational Schedule 2026–2027"

          - name: image
            label: Schedule Image
            type: image
            required: true
            description: "Upload or select the current schedule image. Max file size: 5 MB."

          - name: location
            label: Studio Location
            type: select
            required: true
            options:
              values:
                - Melville
                - Commack


  # ==============================
  # CALENDAR
  # ==============================
  - name: calendar
    label: Calendar
    type: file
    path: src/data/calendar.json
    format: json

    operations:
      delete: false
      rename: false

    fields:
      - name: season
        label: Season
        type: string
        required: true
        description: "Example: 2026–2027"

      - name: eyebrow
        label: Small Heading
        type: string
        required: true

      - name: title
        label: Page Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: image
        label: Calendar Image
        type: image
        required: true
        description: "Upload the current studio-year calendar image. Max file size: 5 MB."

      - name: image_alt
        label: Calendar Image Alt Text
        type: string
        required: true
        description: "Describe the calendar image for accessibility."


  # ==============================
  # SITE ALERT BANNER
  # ==============================
  - name: banner
    label: Site Alert Banner
    type: file
    path: src/data/banner.json
    format: json

    operations:
      delete: false
      rename: false

    fields:
      - name: show
        label: Show Banner on Site
        type: boolean
        description: "Turn on to show the message across the top of every page (for example, weather closings). Turn off to hide it."

      - name: message
        label: Banner Message
        type: string
        description: "Example: We are closed today due to weather. Please stay safe."


  # ==============================
  # ABOUT & PROGRAM PAGES
  # ==============================
  - name: pages
    label: About & Program Pages
    type: collection
    path: src/content/pages
    format: yaml-frontmatter
    exclude:
      - schedules.md
      - genres.md

    filename:
      template: "{primary}.md"

    view:
      primary: title
      fields:
        - title
        - description
      sort:
        - order
        - title
      default:
        sort: order
        order: asc

    operations:
      create: false
      rename: false
      delete: false

    fields:
      - name: title
        label: Page Title
        type: string
        required: true

      - name: description
        label: Short Description
        type: text
        description: "One or two sentences shown under the title and in search results."

      - name: image
        label: Main Image
        type: image
        description: "Optional picture for this page. Max file size: 5 MB."

      - name: section
        label: Page Group
        type: select
        readonly: true
        description: "System value. Please do not change."
        options:
          values:
            - none
            - programs
            - schedules

      - name: order
        label: Display Order
        type: number
        readonly: true
        description: "System value. Please do not change."

      - name: body
        label: Page Content
        type: rich-text
        options:
          format: markdown
          media: false


  # ==============================
  # STUDIO CONTACT INFO & SOCIAL
  # ==============================
  - name: contact
    label: Contact Info & Social Links
    type: file
    path: src/data/locations.json
    format: json

    operations:
      delete: false
      rename: false

    fields:
      - name: locations
        label: Studio Locations
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Studio Name
            type: string
            required: true
            readonly: true
            description: "System value. Please do not change."

          - name: address
            label: Address
            type: string
            required: true

          - name: phone
            label: Phone Number
            type: string
            required: true
            description: "Example: (631) 424-2243"

          - name: email
            label: Studio Email
            type: string
            required: true

          - name: portal
            label: Parent Portal Link
            type: string
            required: true
            description: "Full web address (starts with https://)"

      - name: email
        label: Main Contact Email
        type: string
        required: true

      - name: facebook
        label: Facebook Page Link
        type: string
        description: "Full web address (starts with https://)"

      - name: instagram
        label: Instagram Page Link
        type: string
        description: "Full web address (starts with https://)"


  # ==============================
  # HOME PAGE
  # ==============================
  - name: home
    label: Home Page
    type: file
    path: src/data/home.json
    format: json

    operations:
      delete: false
      rename: false

    fields:
      - name: hero
        label: Top Banner (Hero)
        type: object
        fields:
          - name: eyebrow
            label: Small Line Above Headline
            type: string
          - name: headline_line1
            label: Headline - First Line
            type: string
          - name: headline_line2
            label: Headline - Second Line (shown in accent color)
            type: string
          - name: text
            label: Intro Text
            type: text
          - name: button1_label
            label: First Button - Text
            type: string
          - name: button1_link
            label: First Button - Page Link
            type: string
            description: "Example: /programs"
          - name: button2_label
            label: Second Button - Text
            type: string
          - name: button2_link
            label: Second Button - Page Link
            type: string
            description: "Example: /schedules"
          - name: stat_title
            label: Badge - Large Text
            type: string
            description: "Example: Since 2010"
          - name: stat_text
            label: Badge - Small Text
            type: string

          - name: poster
            label: Banner Still Image
            type: image
            description: "Picture shown while the banner video loads, and on devices that don't play it. Max file size: 5 MB."

          - name: video
            label: Banner Video
            type: file
            options:
              media: videos
              path: public/uploads/client/videos
            description: "Silent video that plays behind the headline. Max file size: 25 MB. Smaller files load faster; about 15 MB or less is best."

      - name: intro
        label: Welcome Section
        type: object
        fields:
          - name: eyebrow
            label: Small Line Above Headline
            type: string
          - name: headline_line1
            label: Headline - First Line
            type: string
          - name: headline_line2
            label: Headline - Second Line
            type: string
          - name: paragraph1
            label: First Paragraph
            type: text
          - name: paragraph2
            label: Second Paragraph
            type: text
          - name: link_label
            label: Link - Text
            type: string
          - name: link_url
            label: Link - Page Address
            type: string
            description: "Example: /about-us"

      - name: programs
        label: Program Cards (Home Page)
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{name}"
        description: "The six program tiles on the home page. Drag to reorder; numbers update automatically."
        fields:
          - name: name
            label: Program Name
            type: string
            required: true
          - name: description
            label: Short Description
            type: text
            required: true
          - name: image
            label: Card Image
            type: image
            description: "Max file size: 5 MB."
            required: true
          - name: image_alt
            label: Image Description (for accessibility)
            type: string
            required: true
            description: "Briefly describe the photo. Example: AIM recreational dancers"
          - name: href
            label: Page Link
            type: string
            required: true
            description: "Example: /recreational-dance/"

      - name: genres
        label: Dance Style Tiles (Home Page)
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{name}"
        description: "The dance style photo tiles on the home page. Drag to reorder; numbers update automatically."
        fields:
          - name: name
            label: Style Name
            type: string
            required: true
          - name: image
            label: Tile Image
            type: image
            description: "Max file size: 5 MB."
            required: true
          - name: href
            label: Page Link
            type: string
            required: true
            description: "Example: /genres/jazz/"

      - name: sections
        label: Other Home Page Headings & Text
        type: object
        description: "Headings and short text for the lower sections of the home page. Event cards, faculty and studio details come from their own sections."
        fields:
          - name: staff
            label: Faculty Section
            type: object
            fields:
              - name: eyebrow
                label: Small Line Above Headline
                type: string
              - name: headline
                label: Headline
                type: string
              - name: link_label
                label: Link Text
                type: string
          - name: experience
            label: 'The AIM Experience Section'
            type: object
            fields:
              - name: eyebrow
                label: Small Line Above Headline
                type: string
              - name: headline_line1
                label: Headline - First Line
                type: string
              - name: headline_line2
                label: Headline - Second Line
                type: string
              - name: text
                label: Paragraph
                type: text
          - name: events
            label: Upcoming Events Section
            type: object
            fields:
              - name: eyebrow
                label: Small Line Above Headline
                type: string
              - name: headline
                label: Headline
                type: string
              - name: link_label
                label: Link Text
                type: string
              - name: empty_message
                label: Message When No Events Are Scheduled
                type: string
              - name: photo_caption
                label: Photo Caption
                type: string
          - name: instagram
            label: Instagram Section
            type: object
            fields:
              - name: eyebrow
                label: Small Line Above Headline
                type: string
              - name: headline
                label: Headline
                type: string
              - name: cta_title
                label: Bottom Box - Title
                type: string
              - name: cta_text
                label: Bottom Box - Text
                type: text
              - name: button_label
                label: Bottom Box - Button Text
                type: string
          - name: locations
            label: Studio Locations Section
            type: object
            fields:
              - name: eyebrow
                label: Small Line Above Headline
                type: string
              - name: headline
                label: Headline
                type: string
          - name: final_cta
            label: Bottom Call-to-Action
            type: object
            fields:
              - name: eyebrow
                label: Small Line Above Headline
                type: string
              - name: headline
                label: Headline
                type: string

          - name: recaps
            label: Past Workshop Recaps Section
            type: object
            fields:
              - name: eyebrow
                label: Small Line Above Headline
                type: string
              - name: headline
                label: Headline
                type: string
              - name: text
                label: Paragraph
                type: text

      - name: story_images
        label: Photo Strip (under Welcome Section)
        type: object
        list:
          min: 3
          max: 3
          collapsible:
            collapsed: true
            summary: "{alt}"
        description: "Three photos. The first one is displayed larger."
        fields:
          - name: image
            label: Photo
            type: image
            description: "Max file size: 5 MB."
            required: true
          - name: alt
            label: Photo Description (for accessibility)
            type: string
            required: true
            description: "Briefly describe the photo. Example: AIM dancers performing together"

      - name: experience_photos
        label: "AIM Experience Photos"
        type: object
        list:
          min: 3
          max: 3
          collapsible:
            collapsed: true
            summary: "{alt}"
        description: "Three photos in the AIM Experience section."
        fields:
          - name: image
            label: Photo
            type: image
            description: "Max file size: 5 MB."
            required: true
          - name: alt
            label: Photo Description (for accessibility)
            type: string
            required: true

      - name: events_photo
        label: Upcoming Events Photo
        type: object
        fields:
          - name: image
            label: Photo
            type: image
            description: "Max file size: 5 MB."
            required: true
          - name: alt
            label: Photo Description (for accessibility)
            type: string
            required: true

      - name: studio_photos
        label: Studio Photos (Find Your Studio)
        type: object
        fields:
          - name: melville
            label: Melville Studio Photo
            type: image
            description: "Max file size: 5 MB."
            required: true
          - name: commack
            label: Commack Studio Photo
            type: image
            description: "Max file size: 5 MB."
            required: true

      - name: recaps
        label: Past Workshop Recap Videos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        description: "Videos shown in the Past Workshop Recaps section. Drag to reorder."
        fields:
          - name: video
            label: Video
            type: file
            required: true
            options:
              media: videos
              path: public/uploads/drive/videos
            description: "Max file size: 25 MB. Smaller files load faster; about 15 MB or less is best."
          - name: title
            label: Guest Artist / Title
            type: string
            required: true
          - name: subtitle
            label: Workshop Name
            type: string
            required: true


  # ==============================
  # DANCE GENRES
  # ==============================
  - name: genres
    label: Dance Genres
    type: file
    path: src/data/genres.json
    format: json

    operations:
      delete: false
      rename: false

    fields:
      - name: page
        label: Dance Genres Page (Headings & Text)
        type: object
        fields:
          - name: hero_eyebrow
            label: Top Banner - Small Line
            type: string
          - name: hero_title
            label: Top Banner - Page Title
            type: string
          - name: hero_text
            label: Top Banner - Intro Text
            type: text
          - name: intro_eyebrow
            label: Intro Section - Small Line
            type: string
          - name: intro_headline
            label: Intro Section - Headline
            type: string
          - name: intro_text
            label: Intro Section - Paragraph
            type: text
          - name: cta_eyebrow
            label: Bottom Banner - Small Line
            type: string
          - name: cta_headline
            label: Bottom Banner - Headline
            type: string

      - name: genres
        label: Dance Genres
        type: object
        list:
          min: 8
          max: 8
          collapsible:
            collapsed: true
            summary: "{name}"
        description: "Edit each genre once; changes show on the Dance Genres overview page and on that genre's own page. Drag to reorder. (The list is fixed at eight genres; contact your web developer to add or remove one.)"
        fields:
          - name: slug
            label: Page Address Ending
            type: string
            readonly: true
            description: "System value. Please do not change."
          - name: name
            label: Genre Name
            type: string
            required: true
          - name: image
            label: Genre Image
            type: image
            required: true
            description: "Max file size: 5 MB."
          - name: card_description
            label: Short Description (shown on the overview page)
            type: text
            required: true
          - name: page_description
            label: Page Description (shown at the top of the genre's own page)
            type: text
            required: true
          - name: note
            label: Important Note (optional)
            type: text
            description: "Optional notice shown on the genre's page, such as approval requirements. Leave blank for none."
